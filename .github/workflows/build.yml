name: Build GDExtension

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone godot-cpp
        run: |
          git clone -b 4.2 https://github.com/godotengine/godot-cpp.git godot-cpp

      - name: Set up Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      - name: Build for Android arm64
        run: |
          export ANDROID_NDK_ROOT="${{ env.ANDROID_NDK_LATEST_HOME }}"
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          cd godot-cpp
          scons platform=android target=template_debug arch=arm64 android_ndk_path="$ANDROID_NDK_ROOT"
          cd ..
          scons platform=android target=template_debug arch=arm64 android_ndk_path="$ANDROID_NDK_ROOT"
